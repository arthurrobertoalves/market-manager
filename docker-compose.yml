services:
  postgres:
    image: postgres:16-alpine
    container_name: market-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
      POSTGRES_DB: market_manager
    ports:
      - "5433:5432"
    volumes:
      - market-manager-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d market_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  market-manager-db-data:
